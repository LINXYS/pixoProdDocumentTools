name: pixo-document-tools-external-db

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-env: &app-env
  PIXO_ACCELERATOR: ${PIXO_ACCELERATOR:-cpu}
  INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-3600}
  RUN_ON_START: ${RUN_ON_START:-true}
  DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-120}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the existing vector database}
  RECORD_MANAGER_DATABASE_URL: ${RECORD_MANAGER_DATABASE_URL:?RECORD_MANAGER_DATABASE_URL must point to the existing record-manager database}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-worker-common: &worker-common
  build: *app-build
  image: pixo-document-tools:runtime
  restart: unless-stopped
  command: ["schedule"]

x-web-common: &web-common
  build: *app-build
  image: pixo-document-tools:runtime
  restart: unless-stopped
  profiles: ["dev"]
  command: ["server"]

services:
  produkte-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-produkte
    volumes:
      - ./kaffeeroesterei-05-10-2025-produkte:/app/kaffeeroesterei-05-10-2025-produkte

  site-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-web
    volumes:
      - ./kaffeeroesterei-05-10-2025-web:/app/kaffeeroesterei-05-10-2025-web

  ftp-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-08-12-2025-ftp-1
    volumes:
      - ./kaffeeroesterei-08-12-2025-ftp-1:/app/kaffeeroesterei-08-12-2025-ftp-1

  sciarc-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: sciarc-pilot-v1
    volumes:
      - ./sciarc-pilot-v1:/app/sciarc-pilot-v1

  produkte-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-produkte
      WEB_PORT: 5000
    ports:
      - "5001:5000"
    volumes:
      - ./kaffeeroesterei-05-10-2025-produkte:/app/kaffeeroesterei-05-10-2025-produkte

  site-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-web
      WEB_PORT: 5000
    ports:
      - "5002:5000"
    volumes:
      - ./kaffeeroesterei-05-10-2025-web:/app/kaffeeroesterei-05-10-2025-web

  ftp-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-08-12-2025-ftp-1
      WEB_PORT: 5000
    ports:
      - "5003:5000"
    volumes:
      - ./kaffeeroesterei-08-12-2025-ftp-1:/app/kaffeeroesterei-08-12-2025-ftp-1

  sciarc-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: sciarc-pilot-v1
      WEB_PORT: 5000
    ports:
      - "5004:5000"
    volumes:
      - ./sciarc-pilot-v1:/app/sciarc-pilot-v1
