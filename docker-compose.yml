name: pixo-document-tools

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-env: &app-env
  PIXO_ACCELERATOR: ${PIXO_ACCELERATOR:-cpu}
  INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-3600}
  RUN_ON_START: ${RUN_ON_START:-true}
  DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-120}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixo_change_me}
  DATABASE_URL: postgresql://pixo:${POSTGRES_PASSWORD:-pixo_change_me}@db:5432/vectorstore
  RECORD_MANAGER_DATABASE_URL: postgresql://pixo:${POSTGRES_PASSWORD:-pixo_change_me}@db:5432/record_manager
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}

x-worker-common: &worker-common
  build: *app-build
  image: pixo-document-tools:runtime
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  command: ["schedule"]

x-web-common: &web-common
  build: *app-build
  image: pixo-document-tools:runtime
  restart: unless-stopped
  profiles: ["dev"]
  depends_on:
    db:
      condition: service_healthy
  command: ["server"]

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixo_change_me}
      POSTGRES_DB: postgres
      VECTOR_DB: vectorstore
      RECORD_MANAGER_DB: record_manager
    volumes:
      - pixo-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  produkte-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-produkte
    volumes:
      - ./kaffeeroesterei-05-10-2025-produkte:/app/kaffeeroesterei-05-10-2025-produkte

  site-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-web
    volumes:
      - ./kaffeeroesterei-05-10-2025-web:/app/kaffeeroesterei-05-10-2025-web

  ftp-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-08-12-2025-ftp-1
    volumes:
      - ./kaffeeroesterei-08-12-2025-ftp-1:/app/kaffeeroesterei-08-12-2025-ftp-1

  sciarc-worker:
    <<: *worker-common
    environment:
      <<: *app-env
      PROJECT_DIR: sciarc-pilot-v1
    volumes:
      - ./sciarc-pilot-v1:/app/sciarc-pilot-v1

  produkte-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-produkte
      WEB_PORT: 5000
    ports:
      - "5001:5000"
    volumes:
      - ./kaffeeroesterei-05-10-2025-produkte:/app/kaffeeroesterei-05-10-2025-produkte

  site-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-05-10-2025-web
      WEB_PORT: 5000
    ports:
      - "5002:5000"
    volumes:
      - ./kaffeeroesterei-05-10-2025-web:/app/kaffeeroesterei-05-10-2025-web

  ftp-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: kaffeeroesterei-08-12-2025-ftp-1
      WEB_PORT: 5000
    ports:
      - "5003:5000"
    volumes:
      - ./kaffeeroesterei-08-12-2025-ftp-1:/app/kaffeeroesterei-08-12-2025-ftp-1

  sciarc-web:
    <<: *web-common
    environment:
      <<: *app-env
      PROJECT_DIR: sciarc-pilot-v1
      WEB_PORT: 5000
    ports:
      - "5004:5000"
    volumes:
      - ./sciarc-pilot-v1:/app/sciarc-pilot-v1

volumes:
  pixo-postgres-data:
